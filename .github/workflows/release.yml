name: release

# 每 3 天扫一次 main。自上次发版以来 plugin/ 或 market.json 有变化就自动发新版本。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
#
# 需要的仓库 secret：NPM_TOKEN
#   npm 账号开了 2FA，必须用带 Bypass 2FA 的 Granular Access Token，
#   否则 publish 会被拒（EOTP 或 403）。

on:
  schedule:
    # 每 3 天 03:00 UTC（北京时间 11:00）。注意 day-of-month 的 */3 落在 1、4、7…31 号，
    # 月末会与月初相邻，实际间隔 1–3 天不等；若要求严格等间隔，改用 daily + 变更检测。
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只检查与打版本号，不真正发布
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 检查上次发版以来是否有改动
        id: changes
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')
          if [ -z "$LAST_TAG" ]; then
            echo "尚无发版 tag，按有改动处理"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "上次发版: $LAST_TAG"
          # 只看影响发布产物的路径：plugin/ 是 npm 包本体，market.json 是插件市场索引
          N=$(git rev-list "$LAST_TAG"..HEAD --count -- plugin market.json)
          echo "自 $LAST_TAG 以来相关改动提交数: $N"
          if [ "$N" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 跳过（无改动）
        if: steps.changes.outputs.changed == 'false'
        run: echo "plugin/ 与 market.json 自上次发版以来没有变化，跳过。"

      - name: 升版本号并同步 market.json
        if: steps.changes.outputs.changed == 'true'
        id: bump
        working-directory: plugin
        run: |
          set -euo pipefail
          PREV=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version >/dev/null
          NEXT=$(node -p "require('./package.json').version")
          echo "版本: $PREV -> $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

          # market.json 的版本与发布时间要和实际发布一致，否则 Discover 显示旧版本
          cd ..
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const index = JSON.parse(fs.readFileSync("market.json", "utf8"));
            const plugin = index.plugins.find((p) => p.name === "dsh-creation-mode");
            if (!plugin) throw new Error("market.json 里找不到 dsh-creation-mode");
            plugin.versions = [{
              version,
              publishTimestamp: Math.floor(Date.now() / 1000),
              source: { type: "npm" },
              engines: { dsh: ">=0.2.1-0" },
            }];
            fs.writeFileSync("market.json", JSON.stringify(index, null, 2) + "\n");
          ' "$NEXT"

      - name: 发布到 npm
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          # 幂等：npm 上已有这个版本就跳过，避免重跑时失败
          if npm view "dsh-creation-mode@$VERSION" version >/dev/null 2>&1; then
            echo "npm 上已有 $VERSION，跳过发布"
          else
            npm publish
          fi

      - name: 提交版本号并打 tag
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/package.json market.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
